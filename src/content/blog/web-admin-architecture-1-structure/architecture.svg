<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660" role="img" aria-labelledby="t d">
<title id="t">웹 어드민 구조</title><desc id="d">app(라우트 · 내비게이션 · 권한 게이트)이 feature 의 Entry 를 마운트한다. feature 안에는 Entry(생명주기) · View(그리기만) · ViewModel(판정 · 화면 상태)이 있고, View 의 휘발 상태는 useState, 화면 지속 상태는 ViewModel 옆 uiAtoms 에 둔다. Store 는 ViewModel 만 부르며 use&lt;이름>Store() 로 state · actions · snapshot 을 받는다. module 은 도메인 상태(SSOT)를 관리한다 — actions 가 service 를 불러 결과를 atoms 에 저장하고, snapshot 이 권한 같은 파생된 답을 낸다. data 는 REST 호출 · DTO 만 하고 상태가 없으며, 권한은 게이트웨이 · 서버가 강제한다. core(useApiQuery · antd 파사드)는 계층 밖에서 가로지르고, I/O 를 하면 data 몫으로 본다. feature 는 data 를 직접 부르지 않고, View 는 Store 를 부르지 않는다.</desc>
<rect width="600" height="660" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="w-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="w-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="w-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="w-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">웹 어드민 구조</text><text x="16" y="50" font-size="12" fill="#6b7280">의존은 위에서 아래로 한 방향 · 계층마다 모르는 것이 있다</text><rect x="16" y="70" width="432" height="46" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="32" y="99" font-size="14" fill="#111318" font-weight="700">app</text><text x="78" y="99" font-size="12" fill="#4b5563">라우트 · 내비게이션 · 권한 게이트</text><line x1="88" y1="116" x2="88" y2="136" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#w-gray)"/><text x="96" y="131" font-size="11" fill="#4b5563">Entry 를 마운트</text><rect x="16" y="140" width="432" height="124" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="32" y="160" font-size="14" fill="#111318" font-weight="700">feature</text><text x="98" y="160" font-size="12" fill="#4b5563">화면</text><rect x="32" y="172" width="112" height="44" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="88" y="191" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">Entry</text><text x="88" y="207" font-size="11" fill="#4b5563" text-anchor="middle">생명주기</text><rect x="164" y="172" width="112" height="44" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="220" y="191" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">View</text><text x="220" y="207" font-size="11" fill="#4b5563" text-anchor="middle">그리기만</text><rect x="304" y="172" width="128" height="44" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="368" y="191" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">ViewModel</text><text x="368" y="207" font-size="11" fill="#4b5563" text-anchor="middle">판정 · 화면 상태</text><line x1="146" y1="194" x2="160" y2="194" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#w-blue)"/><line x1="278" y1="186" x2="300" y2="186" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#w-blue)"/><line x1="302" y1="204" x2="280" y2="204" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#w-blue)"/><rect x="164" y="230" width="112" height="22" rx="11" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/><text x="220" y="245" font-size="11" fill="#4b5563" text-anchor="middle">useState · 휘발</text><rect x="304" y="230" width="128" height="22" rx="11" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/><text x="368" y="245" font-size="11" fill="#4b5563" text-anchor="middle">uiAtoms · 화면 지속</text><line x1="338" y1="268" x2="338" y2="330" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#w-blue)"/><line x1="408" y1="330" x2="408" y2="268" stroke="#047857" stroke-width="1.8" marker-end="url(#w-green)"/><text x="330" y="290" font-size="11" fill="#4b5563" text-anchor="end">actions</text><text x="416" y="290" font-size="11" fill="#4b5563">state</text><text x="416" y="305" font-size="11" fill="#4b5563">snapshot</text><text x="32" y="290" font-size="12" fill="#111318" font-weight="700">Store 는 ViewModel 만 부른다</text><text x="32" y="307" font-size="11" fill="#4b5563">use&lt;이름>Store() → { state, actions, snapshot }</text><rect x="16" y="334" width="432" height="158" rx="10" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="32" y="358" font-size="14" fill="#111318" font-weight="700">module</text><text x="96" y="358" font-size="12" fill="#4b5563">도메인 상태를 관리</text><rect x="380" y="343" width="52" height="22" rx="11" fill="#047857" stroke="#047857" stroke-width="1"/><text x="406" y="358" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">SSOT</text><rect x="32" y="372" width="132" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="98" y="391" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">actions</text><text x="98" y="407" font-size="11" fill="#4b5563" text-anchor="middle">변경 · 재조회까지</text><rect x="300" y="372" width="132" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="366" y="391" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">atoms</text><text x="366" y="407" font-size="11" fill="#4b5563" text-anchor="middle">도메인 상태</text><line x1="166" y1="394" x2="296" y2="394" stroke="#047857" stroke-width="1.8" marker-end="url(#w-green)"/><text x="231" y="388" font-size="11" fill="#4b5563" text-anchor="middle">결과를 저장</text><rect x="32" y="438" width="132" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="98" y="457" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">service</text><text x="98" y="473" font-size="11" fill="#4b5563" text-anchor="middle">API 를 감싼다</text><rect x="300" y="438" width="132" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="366" y="457" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">snapshot</text><text x="366" y="473" font-size="11" fill="#4b5563" text-anchor="middle">파생된 답 · can(권한)</text><line x1="98" y1="417" x2="98" y2="435" stroke="#047857" stroke-width="1.8" marker-end="url(#w-green)"/><line x1="366" y1="417" x2="366" y2="435" stroke="#047857" stroke-width="1.8" marker-end="url(#w-green)"/><line x1="98" y1="484" x2="98" y2="532" stroke="#eb6834" stroke-width="1.8" marker-end="url(#w-orange)"/><text x="106" y="514" font-size="11" fill="#4b5563">부른다</text><rect x="16" y="536" width="260" height="62" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="32" y="560" font-size="14" fill="#111318" font-weight="700">data</text><text x="76" y="560" font-size="12" fill="#4b5563">REST 호출 · DTO · 직렬화</text><text x="32" y="581" font-size="11" fill="#4b5563">상태는 없다</text><line x1="278" y1="567" x2="294" y2="567" stroke="#eb6834" stroke-width="1.8" marker-end="url(#w-orange)"/><rect x="298" y="536" width="150" height="62" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/><text x="312" y="560" font-size="13" fill="#111318" font-weight="700">게이트웨이 · 서버</text><text x="312" y="581" font-size="11" fill="#4b5563">권한은 여기서 강제</text><rect x="464" y="140" width="120" height="458" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="478" y="164" font-size="14" fill="#111318" font-weight="700">core</text><text x="478" y="182" font-size="11" fill="#4b5563">계층 밖에서</text><text x="478" y="197" font-size="11" fill="#4b5563">가로지른다</text><rect x="474" y="214" width="100" height="44" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="524" y="233" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">useApiQuery</text><text x="524" y="249" font-size="11" fill="#4b5563" text-anchor="middle">토큰 · 401/403</text><rect x="474" y="270" width="100" height="44" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="524" y="289" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">antd 파사드</text><text x="524" y="305" font-size="11" fill="#4b5563" text-anchor="middle">화면이 바로 쓴다</text><line x1="474" x2="574" y1="478" y2="478" stroke="#9ca3af" stroke-dasharray="3 3"/><text x="478" y="500" font-size="11" fill="#4b5563">경로가 아니라</text><text x="478" y="515" font-size="11" fill="#4b5563">내용으로 판정 —</text><text x="478" y="530" font-size="11" fill="#4b5563">I/O 를 하면</text><text x="478" y="545" font-size="11" fill="#4b5563">data 몫이다</text><circle cx="25" cy="622" r="8" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="25" y="626" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="40" y="626" font-size="12" fill="#111318">feature 는 data 를 직접 부르지 않는다 — 남은 예외는 줄어들기만 한다</text><circle cx="25" cy="646" r="8" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="25" y="650" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="40" y="650" font-size="12" fill="#111318">View 는 Store 를 부르지 않고, 화면은 역할 이름 대신 권한 키로 묻는다</text></g>
</svg>