<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="t d">
<title id="t">앱 정보 화면이 지난 길</title><desc id="d">조사부터 완료 기준까지는 설정 화면 전체 기준이고 실행이 앱 정보 몫. 조사(검수 세 라운드, 설정 전체 지적 약 24 → 10 → 7) → 아키텍처(한 번 반려, 원장을 다시 씀) → BDD(반송 1, 세 라운드, 시나리오 177) → SDD(세 라운드, 어긋난 사본을 하나로) → 계획(세 라운드, 반송 13, 슬라이스 22) → 완료 기준(세 번 반려 뒤 통과) → 실행(독립 검수, 명세 → Store → 화면) → 검증(설정 화면 전체 기준으로 아직 열려 있음). 앱 정보 화면 쪽 작업은 커밋 시각으로 약 4시간 반(실행 단계만 약 3시간), 설정 화면 전체는 약 86시간(AI 작업이 겹친 커밋 기준).</desc>
<rect width="600" height="360" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="t-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><text x="16" y="28" font-size="17" fill="#111318" font-weight="700">앱 정보 화면이 지난 길</text><text x="16" y="48" font-size="12" fill="#6b7280">조사 ~ 완료 기준은 설정 화면 전체 기준 · 실행이 앱 정보 몫 · 단계마다 독립 검수, 최대 세 라운드</text><rect x="16" y="76" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="28" y="100" font-size="13" fill="#111318" font-weight="700">1. 조사</text><text x="28" y="118" font-size="11" fill="#6b7280">검수 세 라운드</text><text x="28" y="138" font-size="11.5" fill="#111318">지적 약 24 → 10 → 7</text><rect x="162" y="76" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="174" y="100" font-size="13" fill="#111318" font-weight="700">2. 아키텍처</text><text x="174" y="118" font-size="11" fill="#6b7280">한 번 반려</text><text x="174" y="138" font-size="11.5" fill="#111318">원장을 다시 씀</text><rect x="308" y="76" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="320" y="100" font-size="13" fill="#111318" font-weight="700">3. BDD</text><text x="320" y="118" font-size="11" fill="#6b7280">반송 1 · 세 라운드</text><text x="320" y="138" font-size="11.5" fill="#111318">시나리오 177</text><rect x="454" y="76" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="466" y="100" font-size="13" fill="#111318" font-weight="700">4. SDD</text><text x="466" y="118" font-size="11" fill="#6b7280">세 라운드</text><text x="466" y="138" font-size="11.5" fill="#111318">어긋난 사본을 하나로</text><rect x="454" y="226" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="466" y="250" font-size="13" fill="#111318" font-weight="700">5. 계획</text><text x="466" y="268" font-size="11" fill="#6b7280">세 라운드 · 반송 13</text><text x="466" y="288" font-size="11.5" fill="#111318">슬라이스 22</text><rect x="308" y="226" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="320" y="250" font-size="13" fill="#111318" font-weight="700">6. 완료 기준</text><text x="320" y="268" font-size="11" fill="#6b7280">세 번 반려</text><text x="320" y="288" font-size="11.5" fill="#111318">고친 뒤 통과</text><rect x="162" y="226" width="130" height="78" rx="10" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="174" y="250" font-size="13" fill="#111318" font-weight="700">7. 실행</text><text x="174" y="268" font-size="11" fill="#6b7280">독립 검수 · 반려</text><text x="174" y="288" font-size="11.5" fill="#111318">명세 → Store → 화면</text><rect x="16" y="226" width="130" height="78" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.3"/><text x="28" y="250" font-size="13" fill="#111318" font-weight="700">8. 검증</text><text x="28" y="268" font-size="11" fill="#6b7280">아직 열려 있음</text><text x="28" y="288" font-size="11.5" fill="#111318">설정 화면 전체</text><line x1="148" y1="115" x2="160" y2="115" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><line x1="294" y1="115" x2="306" y2="115" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><line x1="440" y1="115" x2="452" y2="115" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><path d="M519,156 V222" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><line x1="452" y1="265" x2="440" y2="265" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><line x1="306" y1="265" x2="294" y2="265" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><line x1="160" y1="265" x2="148" y2="265" stroke="#047857" stroke-width="1.8" marker-end="url(#t-ah)"/><text x="16" y="328" font-size="12" fill="#4b5563">앱 정보 화면 쪽 작업은 커밋 시각으로 약 4시간 반(실행 단계만 약 3시간)</text><text x="16" y="346" font-size="12" fill="#4b5563">설정 화면 전체는 약 86시간 — AI 작업이 겹친 커밋 기준이라 사람의 시간이 아니다</text></g>
</svg>