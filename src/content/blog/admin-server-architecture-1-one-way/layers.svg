<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
<title id="t">어드민 서버의 계층</title><desc id="d">자바 파일 1,321개 기준. controller(412) → service(476, usecase 포함) → repository(82) → domain(127) 순서로 아래로만 의존한다. client(63)는 다른 서비스로 가는 어댑터로 service 와 같은 높이에 있고, exception 잎(59)은 오류 코드 · 예외로 모든 계층이 쓸 수 있지만 다른 계층을 부르지 않는다. 위로 가는 의존과 controller 가 repository · domain 을 바로 쓰는 것은 금지다. 설정 · 보안 · 로깅 102개는 계층 밖이라 가드가 재지 않는다.</desc>
<rect width="600" height="560" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">어드민 서버의 계층</text><text x="16" y="50" font-size="12" fill="#6b7280">의존은 아래로만 · 괄호는 파일 수(자바 파일 1,321개 기준)</text><rect x="16" y="80" width="340" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="32" y="108" font-size="14" fill="#111318" font-weight="700">controller (412)</text><text x="32" y="130" font-size="11.5" fill="#4b5563">HTTP 입출력 · 요청 검증 · 요청 → 서비스 DTO 변환</text><line x1="186" y1="152" x2="186" y2="177" stroke="#047857" stroke-width="1.8" marker-end="url(#a-g)"/><rect x="16" y="180" width="340" height="70" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/><text x="32" y="208" font-size="14" fill="#111318" font-weight="700">service (476)</text><text x="32" y="230" font-size="11.5" fill="#4b5563">업무 흐름 조율 · 트랜잭션 경계 · 엔티티 ↔ DTO</text><line x1="186" y1="252" x2="186" y2="277" stroke="#047857" stroke-width="1.8" marker-end="url(#a-g)"/><rect x="16" y="280" width="340" height="70" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="32" y="308" font-size="14" fill="#111318" font-weight="700">repository (82)</text><text x="32" y="330" font-size="11.5" fill="#4b5563">JPA · QueryDSL 로 저장 · 조회</text><line x1="186" y1="352" x2="186" y2="377" stroke="#047857" stroke-width="1.8" marker-end="url(#a-g)"/><rect x="16" y="380" width="340" height="70" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="2"/><text x="32" y="408" font-size="14" fill="#111318" font-weight="700">domain (127)</text><text x="32" y="430" font-size="11.5" fill="#4b5563">엔티티 · 값 · 도메인 규칙 · 도메인 예외</text><rect x="252" y="190" width="92" height="26" rx="13" fill="#ffffff" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><text x="298" y="207" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="700">usecase 포함</text><rect x="392" y="180" width="192" height="70" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="408" y="208" font-size="14" fill="#111318" font-weight="700">client (63)</text><text x="408" y="230" font-size="11.5" fill="#4b5563">다른 서비스로 가는 어댑터</text><line x1="358" y1="215" x2="388" y2="215" stroke="#047857" stroke-width="1.8" marker-end="url(#a-g)"/><rect x="392" y="380" width="192" height="70" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/><text x="408" y="408" font-size="14" fill="#111318" font-weight="700">exception 잎 (59)</text><text x="408" y="430" font-size="11.5" fill="#4b5563">오류 코드 · 예외 — 아무도 안 부름</text><line x1="358" y1="415" x2="388" y2="415" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a-gray)"/><text x="488" y="370" font-size="11" fill="#4b5563" text-anchor="middle">모든 계층이 쓸 수 있다</text><circle cx="25" cy="478" r="9" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="25" y="482" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="42" y="482" font-size="12" fill="#111318">위로 가는 의존 — domain → service, client → controller 등</text><circle cx="25" cy="502" r="9" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="25" y="506" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="42" y="506" font-size="12" fill="#111318">controller 가 repository · domain 을 바로 쓰기</text><text x="16" y="532" font-size="11.5" fill="#4b5563">설정 · 보안 · 로깅(102)은 계층 밖 — 가드가 재지 않고 리뷰로 본다</text></g>
</svg>