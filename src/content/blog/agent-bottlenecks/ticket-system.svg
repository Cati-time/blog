<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
<title id="t">티켓 시스템 구조</title><desc id="d">세션 A 의 명령을 쓰기를 전담하는 프로세스 하나가 차례로 처리해 이벤트 로그에 쌓고, 세션 목록에서 받는 세션을 찾아 구독 중인 세션 B 에 알림을 보낸다. 구독하지 않던 세션의 이벤트는 쌓여 있다가 다시 구독할 때 전달된다.</desc>
<rect width="600" height="340" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="t-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="t-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="t-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="16" y="30" font-size="17" fill="#111318" font-weight="700">티켓 시스템 — 요청은 기록하고, 받는 세션에 알립니다</text><rect x="16" y="70" width="150" height="58" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="91" y="93" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">세션 A</text><text x="91" y="112" font-size="12" fill="#4b5563" text-anchor="middle">티켓 열기 · 완료</text><rect x="225" y="70" width="150" height="58" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="300" y="93" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">쓰기를 전담하는 프로세스</text><text x="300" y="112" font-size="12" fill="#4b5563" text-anchor="middle">명령을 차례로 처리</text><rect x="434" y="70" width="150" height="58" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="509" y="93" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">세션 B</text><text x="509" y="112" font-size="12" fill="#4b5563" text-anchor="middle">백그라운드로 구독</text><rect x="120" y="210" width="165" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="202.5" y="233" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">이벤트 로그</text><text x="202.5" y="252" font-size="12" fill="#4b5563" text-anchor="middle">순서대로 번호를 붙임</text><rect x="315" y="210" width="165" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="397.5" y="233" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">세션 목록</text><text x="397.5" y="252" font-size="12" fill="#4b5563" text-anchor="middle">누가 받을지 확인</text><line x1="166" y1="99" x2="223" y2="99" stroke="#2a78d6" stroke-width="2" marker-end="url(#t-b)"/><text x="195" y="88" font-size="12" fill="#2a78d6" text-anchor="middle">명령</text><line x1="375" y1="99" x2="432" y2="99" stroke="#047857" stroke-width="2" marker-end="url(#t-g)"/><text x="404" y="88" font-size="12" fill="#047857" text-anchor="middle">알림</text><line x1="265" y1="128" x2="215" y2="208" stroke="#9ca3af" stroke-width="2" marker-end="url(#t-x)"/><line x1="335" y1="128" x2="385" y2="208" stroke="#9ca3af" stroke-width="2" marker-end="url(#t-x)"/><text x="16" y="304" font-size="12" fill="#4b5563">구독 명령은 이벤트를 받으면 끝나고, 명령이 끝났다는 알림을 받은 세션이 다시 시작합니다</text><text x="16" y="324" font-size="12" fill="#4b5563">구독하지 않던 세션의 이벤트는 쌓여 있다가 다시 구독할 때 전달됩니다</text></g>
</svg>