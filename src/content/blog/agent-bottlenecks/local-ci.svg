<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
<title id="t">로컬 CI 구조</title><desc id="d">작업 세션이 브랜치를 제출하면 큐에 쌓이고, 통합 브랜치 위에 임시로 머지해 빌드 · 테스트 · 규칙 검사를 한다(컴퓨터 전체에서 동시에 기본 2개까지). 통과하면 통합 브랜치에 반영하고 개발 서버를 실행하거나 기기에 설치한다. 실패하거나 충돌하면 통합 브랜치는 그대로 두고 제출한 세션에 알린다.</desc>
<rect width="600" height="400" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="c-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="c-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="c-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="16" y="30" font-size="17" fill="#111318" font-weight="700">로컬 CI — 머지와 빌드를 차례로 처리합니다</text><rect x="16" y="64" width="165" height="58" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="98.5" y="87" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">작업 세션</text><text x="98.5" y="106" font-size="12" fill="#4b5563" text-anchor="middle">브랜치를 제출</text><rect x="217" y="64" width="165" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="299.5" y="87" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">큐</text><text x="299.5" y="106" font-size="12" fill="#4b5563" text-anchor="middle">차례로 꺼냄</text><rect x="418" y="64" width="166" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="501" y="87" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">임시 머지</text><text x="501" y="106" font-size="12" fill="#4b5563" text-anchor="middle">통합 브랜치 위에서</text><rect x="418" y="190" width="166" height="58" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="501" y="213" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">빌드 · 테스트 · 규칙 검사</text><text x="501" y="232" font-size="12" fill="#4b5563" text-anchor="middle">동시에 기본 2개까지</text><rect x="217" y="190" width="165" height="58" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="299.5" y="213" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">통합 브랜치에 반영</text><text x="299.5" y="232" font-size="12" fill="#4b5563" text-anchor="middle">통과했을 때만</text><rect x="16" y="190" width="165" height="58" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="98.5" y="213" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">실행 · 설치</text><text x="98.5" y="232" font-size="12" fill="#4b5563" text-anchor="middle">개발 서버 · 기기</text><rect x="318" y="305" width="266" height="58" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="451" y="328" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">제출한 세션에 알림</text><text x="451" y="347" font-size="12" fill="#4b5563" text-anchor="middle">통합 브랜치는 그대로 둠</text><line x1="181" y1="93" x2="215" y2="93" stroke="#2a78d6" stroke-width="2" marker-end="url(#c-b)"/><line x1="382" y1="93" x2="416" y2="93" stroke="#2a78d6" stroke-width="2" marker-end="url(#c-b)"/><line x1="501" y1="122" x2="501" y2="188" stroke="#2a78d6" stroke-width="2" marker-end="url(#c-b)"/><line x1="418" y1="219" x2="384" y2="219" stroke="#047857" stroke-width="2" marker-end="url(#c-g)"/><line x1="217" y1="219" x2="183" y2="219" stroke="#047857" stroke-width="2" marker-end="url(#c-g)"/><text x="401" y="182" font-size="12" fill="#047857" text-anchor="middle">통과</text><line x1="501" y1="248" x2="501" y2="303" stroke="#eb6834" stroke-width="2" marker-end="url(#c-o)"/><text x="510" y="280" font-size="12" fill="#eb6834">실패</text><text x="16" y="388" font-size="12" fill="#4b5563">임시 머지에서 충돌한 CI 요청은 빼서 제출한 세션에 알리고, 나머지는 계속 진행합니다</text></g>
</svg>