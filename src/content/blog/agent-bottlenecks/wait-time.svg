<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-labelledby="t d">
<title id="t">로컬 CI 대기 시간</title><desc id="d">최근 7일 코드 요청 170건. 제출부터 첫 빌드 · 테스트 시작까지 중앙값 32초, p90 2,509초. 첫 빌드 · 테스트 실행은 중앙값 90초, p90 396초.</desc>
<rect width="600" height="270" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="16" y="30" font-size="17" fill="#111318" font-weight="700">절반은 바로 시작하고, 넷에 하나는 10분 이상 기다렸습니다</text><text x="16" y="50" font-size="12" fill="#6b7280">최근 7일(2026년 11월 18일 18시 ~ 25일) 코드 요청 170건 · 단위 초</text><text x="16" y="84" font-size="13" fill="#111318" font-weight="700">제출 → 첫 빌드 · 테스트 시작</text><rect x="16" y="94" width="5.611797528895975" height="18" fill="#047857"/><text x="29.611797528895977" y="108" font-size="12" fill="#4b5563">중앙값 32초</text><rect x="16" y="118" width="440" height="18" fill="#eb6834"/><text x="464" y="132" font-size="12" fill="#4b5563">p90 2,509초</text><text x="16" y="174" font-size="13" fill="#111318" font-weight="700">첫 빌드 · 테스트 실행</text><rect x="16" y="184" width="15.783180550019928" height="18" fill="#047857"/><text x="39.78318055001993" y="198" font-size="12" fill="#4b5563">중앙값 90초</text><rect x="16" y="208" width="69.44599442008769" height="18" fill="#eb6834"/><text x="93.44599442008769" y="222" font-size="12" fill="#4b5563">p90 396초</text><text x="16" y="258" font-size="12" fill="#4b5563">대기에는 앞 요청 · 빌드 차례 · 머지 시간과, 사람이 멈춰 둔 시간이 들어갈 수 있다</text></g>
</svg>