<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-labelledby="t d">
<title id="t">로컬 CI 대기 시간</title><desc id="d">빌드 · 테스트를 실행한 CI 요청 241건. 제출부터 첫 번째 빌드 · 테스트 시작까지 중앙값 37초, p90 2,968초. 첫 번째 빌드 · 테스트 실행은 중앙값 79초, p90 351초.</desc>
<rect width="600" height="270" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="16" y="30" font-size="17" fill="#111318" font-weight="700">절반은 37초 안에 시작하고, 약 30%는 10분 이상 기다렸습니다</text><text x="16" y="50" font-size="12" fill="#6b7280">2026년 11월 18일 18시 ~ 25일 18시 · CI 요청 241건 · 단위 초</text><text x="16" y="84" font-size="13" fill="#111318" font-weight="700">제출 → 첫 번째 빌드 · 테스트 시작</text><rect x="16" y="94" width="5.485175202156334" height="18" fill="#047857"/><text x="29.485175202156334" y="108" font-size="12" fill="#4b5563">중앙값 37초</text><rect x="16" y="118" width="440" height="18" fill="#eb6834"/><text x="464" y="132" font-size="12" fill="#4b5563">p90 2,968초</text><text x="16" y="174" font-size="13" fill="#111318" font-weight="700">첫 번째 빌드 · 테스트 실행</text><rect x="16" y="184" width="11.711590296495956" height="18" fill="#047857"/><text x="35.711590296495956" y="198" font-size="12" fill="#4b5563">중앙값 79초</text><rect x="16" y="208" width="52.03504043126684" height="18" fill="#eb6834"/><text x="76.03504043126685" y="222" font-size="12" fill="#4b5563">p90 351초</text><text x="16" y="258" font-size="12" fill="#4b5563">대기에는 앞 CI 요청 · 빌드 차례 · 머지 시간과, 사람이 멈춰 둔 시간이 섞여 있을 수 있습니다</text></g>
</svg>