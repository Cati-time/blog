<title id="t">서버 기능 개발 — 행동 11 개</title><desc id="d">무엇을 만들지 정하기(사람) · 일감을 티켓으로 넘기기(자동) · 세션 열기(사람) · 설계 문서(자동) · 실행 직전 판정(자동) · 코드 쓰기 · 커밋(자동) · 테스트 쓰기 · 검사(자동) · 실환경 테스트(자동) · 리뷰(자동) · 진행 기록(자동) · 결과가 목적과 맞나 판정(사람). 자동 8 ÷ 11 = 73 %.</desc>
