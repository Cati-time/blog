<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
<title id="t">AI 의 선택지를 좁힌다</title><desc id="d">규칙이 없으면 화면에서 목록을 보여 주는 길이 API 직접 호출, 다른 화면 상태 복사, 공용 유틸, 옛 코드의 판정 복사 등 여러 개로 열려 있다. 규칙이 있으면 화면 → ViewModel → module 의 한 길만 남고, 틀린 길은 빌드가 막는다.</desc>
<rect width="600" height="330" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="o-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="o-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="o-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/></marker><marker id="o-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">AI 의 선택지를 좁힌다</text><text x="16" y="50" font-size="12" fill="#6b7280">같은 요구(«목록을 보여 줘»)에 AI 가 고를 수 있는 길</text><text x="150" y="82" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">규칙이 없을 때</text><rect x="16" y="168" width="110" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="71" y="195" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">화면</text><rect x="160" y="98" width="128" height="36" rx="7" fill="#ffffff" stroke="#d03b3b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="224" y="121" font-size="11" fill="#111318" text-anchor="middle">API 직접 호출</text><path d="M126,188 C143,188 140,116 157,116" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#o-r)"/><rect x="160" y="148" width="128" height="36" rx="7" fill="#ffffff" stroke="#d03b3b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="224" y="171" font-size="11" fill="#111318" text-anchor="middle">다른 화면 상태 복사</text><path d="M126,188 C143,188 140,166 157,166" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#o-r)"/><rect x="160" y="198" width="128" height="36" rx="7" fill="#ffffff" stroke="#d03b3b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="224" y="221" font-size="11" fill="#111318" text-anchor="middle">공용 유틸</text><path d="M126,188 C143,188 140,216 157,216" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#o-r)"/><rect x="160" y="248" width="128" height="36" rx="7" fill="#ffffff" stroke="#d03b3b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="224" y="271" font-size="11" fill="#111318" text-anchor="middle">옛 코드의 판정 복사</text><path d="M126,188 C143,188 140,266 157,266" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#o-r)"/><text x="152" y="310" font-size="11" fill="#4b5563" text-anchor="middle">모두 «돌아가는» 코드 — 판단이 흩어진다</text><text x="460" y="82" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">규칙이 있을 때</text><rect x="400" y="98" width="120" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="460" y="125" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">화면</text><rect x="400" y="168" width="120" height="40" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="460" y="195" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">ViewModel</text><rect x="400" y="238" width="120" height="40" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="460" y="265" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">module (SSOT)</text><line x1="460" y1="140" x2="460" y2="164" stroke="#047857" stroke-width="1.8" marker-end="url(#o-g)"/><line x1="460" y1="210" x2="460" y2="234" stroke="#047857" stroke-width="1.8" marker-end="url(#o-g)"/><text x="526" y="190" font-size="11.5" fill="#047857" font-weight="700">길이 하나</text><text x="460" y="310" font-size="11" fill="#4b5563" text-anchor="middle">틀린 길은 빌드가 막는다</text><line x1="300" x2="300" y1="74" y2="310" stroke="#e5e7eb" stroke-width="1"/></g>
</svg>