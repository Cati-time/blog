<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d">
<title id="t">세 저장소의 계층</title><desc id="d">안드로이드 앱은 app → feature → module → data·bridge, 웹 어드민은 app → feature → module → data, 백엔드 서버는 controller → service·usecase → repository → domain 으로 위에서 아래로만 의존한다. 앱 두 곳에는 계층 밖에서 가로지르는 공통 코드 core 가 있다.</desc>
<rect width="600" height="470" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="l-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="l-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="l-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/></marker><marker id="l-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">세 저장소의 계층</text><text x="16" y="50" font-size="12" fill="#6b7280">위에서 아래로만 의존한다 · 가로로 놓인 core 는 계층이 아니라 공통 코드</text><text x="104" y="80" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">안드로이드 앱</text><rect x="16" y="92" width="176" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="104" y="113" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">app</text><text x="104" y="130" font-size="11" fill="#4b5563" text-anchor="middle">진입 · 조립 · 화면 이동</text><line x1="104" y1="146" x2="104" y2="164" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="16" y="166" width="176" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="104" y="187" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">feature</text><text x="104" y="204" font-size="11" fill="#4b5563" text-anchor="middle">화면 — View · ViewModel</text><line x1="104" y1="220" x2="104" y2="238" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="16" y="240" width="176" height="52" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="104" y="261" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">module</text><text x="104" y="278" font-size="11" fill="#4b5563" text-anchor="middle">도메인 상태 (SSOT)</text><line x1="104" y1="294" x2="104" y2="312" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="16" y="314" width="176" height="52" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="104" y="335" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">data · bridge</text><text x="104" y="352" font-size="11" fill="#4b5563" text-anchor="middle">서버 · DB · OS 신호</text><text x="300" y="80" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">웹 어드민</text><rect x="212" y="92" width="176" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="300" y="113" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">app</text><text x="300" y="130" font-size="11" fill="#4b5563" text-anchor="middle">라우트 · 내비게이션</text><line x1="300" y1="146" x2="300" y2="164" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="212" y="166" width="176" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="187" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">feature</text><text x="300" y="204" font-size="11" fill="#4b5563" text-anchor="middle">화면 — View · ViewModel</text><line x1="300" y1="220" x2="300" y2="238" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="212" y="240" width="176" height="52" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="300" y="261" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">module</text><text x="300" y="278" font-size="11" fill="#4b5563" text-anchor="middle">도메인 상태 (SSOT)</text><line x1="300" y1="294" x2="300" y2="312" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="212" y="314" width="176" height="52" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="300" y="335" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">data</text><text x="300" y="352" font-size="11" fill="#4b5563" text-anchor="middle">REST 호출 · DTO</text><text x="496" y="80" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">백엔드 서버</text><rect x="408" y="92" width="176" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="496" y="113" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">controller</text><text x="496" y="130" font-size="11" fill="#4b5563" text-anchor="middle">요청 → 서비스 DTO</text><line x1="496" y1="146" x2="496" y2="164" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="408" y="166" width="176" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="496" y="187" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">service · usecase</text><text x="496" y="204" font-size="11" fill="#4b5563" text-anchor="middle">업무 흐름 조율</text><line x1="496" y1="220" x2="496" y2="238" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="408" y="240" width="176" height="52" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="496" y="261" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">repository</text><text x="496" y="278" font-size="11" fill="#4b5563" text-anchor="middle">저장 · 조회</text><line x1="496" y1="294" x2="496" y2="312" stroke="#047857" stroke-width="1.8" marker-end="url(#l-g)"/><rect x="408" y="314" width="176" height="52" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="496" y="335" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">domain</text><text x="496" y="352" font-size="11" fill="#4b5563" text-anchor="middle">엔티티 · 규칙</text><rect x="16" y="380" width="372" height="40" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="202" y="405" font-size="11.5" fill="#4b5563" text-anchor="middle">core — 디자인 시스템 · 로거 · HTTP 클라이언트 등 (계층 밖 공통)</text><rect x="408" y="380" width="176" height="40" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="496" y="405" font-size="11.5" fill="#4b5563" text-anchor="middle">앱 화면이 없어 계층 넷</text><text x="16" y="456" font-size="12" fill="#111318">화살표 = «이 계층은 아래 계층만 안다(import 한다)» · 거꾸로나 건너뛰기는 막는다</text></g>
</svg>