<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="t d">
<title id="t">의존은 한 방향으로만</title><desc id="d">화면 계층은 상태·업무 계층을, 상태·업무 계층은 데이터 계층을 부르는 것만 허용한다. 화면이 데이터 계층을 바로 부르는 건너뛰기와, 아래 계층이 위 계층을 import 하는 거꾸로는 막는다. 안드로이드는 Gradle 모듈 의존과 검사 스크립트, 웹 어드민은 ESLint 규칙을 CI 빌드가, 백엔드 A 는 모듈 의존 방향의 컴파일 오류가, 백엔드 B 는 import 방향 가드가 막는다.</desc>
<rect width="600" height="430" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="d-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="d-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="d-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/></marker><marker id="d-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">의존은 한 방향으로만</text><text x="16" y="50" font-size="12" fill="#6b7280">허용되는 화살표는 하나 · 건너뛰기와 거꾸로는 기계가 막는다</text><rect x="40" y="78" width="200" height="54" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="140" y="99" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">화면 계층</text><text x="140" y="116" font-size="11" fill="#4b5563" text-anchor="middle">feature · controller</text><rect x="40" y="192" width="200" height="54" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="140" y="213" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">상태 · 업무 계층</text><text x="140" y="230" font-size="11" fill="#4b5563" text-anchor="middle">module · service</text><rect x="40" y="306" width="200" height="54" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="140" y="327" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">데이터 계층</text><text x="140" y="344" font-size="11" fill="#4b5563" text-anchor="middle">data · repository</text><line x1="110" y1="134" x2="110" y2="188" stroke="#047857" stroke-width="1.8" marker-end="url(#d-g)"/><line x1="110" y1="248" x2="110" y2="302" stroke="#047857" stroke-width="1.8" marker-end="url(#d-g)"/><text x="118" y="166" font-size="11" fill="#047857" font-weight="700">허용</text><text x="118" y="280" font-size="11" fill="#047857" font-weight="700">허용</text><path d="M240,105 C300,150 300,290 240,333" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#d-r)"/><circle cx="285" cy="219" r="9" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="285" y="223" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="298" y="214" font-size="11.5" fill="#d03b3b" font-weight="700">건너뛰기</text><text x="298" y="230" font-size="11" fill="#4b5563">화면 → 데이터</text><path d="M40,333 C6,290 6,150 40,105" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#d-r)"/><circle cx="14" cy="219" r="9" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="14" y="223" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="6" y="246" font-size="11.5" fill="#d03b3b" font-weight="700">거꾸로</text><text x="48" y="392" font-size="11" fill="#4b5563">거꾸로: 아래 계층이 위 계층을 import (예: 도메인이 서비스를, 서비스가 컨트롤러의 요청 클래스를)</text><text x="384" y="92" font-size="13" fill="#111318" font-weight="700">누가 막나</text><rect x="384" y="108" width="200" height="46" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="396" y="127" font-size="12" fill="#111318" font-weight="700">안드로이드</text><text x="396" y="144" font-size="11" fill="#4b5563">Gradle 모듈 의존 + 검사 스크립트</text><rect x="384" y="164" width="200" height="46" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="396" y="183" font-size="12" fill="#111318" font-weight="700">웹 어드민</text><text x="396" y="200" font-size="11" fill="#4b5563">ESLint 규칙 → CI 빌드 실패</text><rect x="384" y="220" width="200" height="46" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="396" y="239" font-size="12" fill="#111318" font-weight="700">백엔드 A</text><text x="396" y="256" font-size="11" fill="#4b5563">모듈 의존 방향 — 컴파일 오류</text><rect x="384" y="276" width="200" height="46" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="396" y="295" font-size="12" fill="#111318" font-weight="700">백엔드 B</text><text x="396" y="312" font-size="11" fill="#4b5563">import 방향 가드 — 빌드 전 실패</text></g>
</svg>