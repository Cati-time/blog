<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
<title id="t">Business Flow 를 도입하는 여섯 단계</title><desc id="d">S0 저장소를 파악한다(빌드 · 테스트 실행 결과 · 에이전트가 못 하는 일, 완료 기준: 규칙 문서 폴더 첫 커밋) → S1 머지 경로(규칙 문서 머리와 계층 표, 통합 브랜치, 완료 기준: 첫 결정 기록이 초록으로 머지) → S2 Supervisor 세션(티켓 · 명부, 완료 기준: 왕복 1회 · 묵은 요청 0) → S3 현재 버전 받기(완료 기준: 인용 버전이 현재 버전) → S4 첫 Subflow(실제 일 하나 · 규칙마다 자동 검사, 완료 기준: 계약 표 1행 · 대상 0 이면 실패) → S5 첫 Business Flow(완료 기준: Report · Supervisor 가 닫음 1회). 그 뒤 단계는 필요가 생겼을 때만 연다.</desc>
<rect width="600" height="560" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="s-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">Business Flow 를 도입하는 여섯 단계</text><text x="16" y="50" font-size="12" fill="#6b7280">다음 단계는 앞 단계가 실제로 돌았다는 증거가 있을 때 연다</text><text x="200" y="78" font-size="11.5" fill="#6b7280" font-weight="700">할 일</text><text x="404" y="78" font-size="11.5" fill="#6b7280" font-weight="700">완료 기준</text><rect x="16" y="88" width="568" height="56" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="116" r="17" fill="#9ca3af"/><text x="44" y="120" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S0</text><text x="72" y="121" font-size="13" fill="#111318" font-weight="700">저장소를 파악한다</text><text x="200" y="121" font-size="11.5" fill="#4b5563">빌드 · 테스트 실행 결과 · 못 하는 일</text><text x="404" y="121" font-size="11.5" fill="#047857">✓ 규칙 문서 폴더 첫 커밋</text><line x1="44" y1="135" x2="44" y2="160" stroke="#047857" stroke-width="1.8" marker-end="url(#s-g)"/><rect x="16" y="162" width="568" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="190" r="17" fill="#9ca3af"/><text x="44" y="194" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S1</text><text x="72" y="195" font-size="13" fill="#111318" font-weight="700">머지 경로</text><text x="200" y="195" font-size="11.5" fill="#4b5563">규칙 문서 머리 + 계층 표 · 통합 브랜치</text><text x="404" y="195" font-size="11.5" fill="#047857">✓ 첫 결정 기록이 초록으로 머지</text><line x1="44" y1="209" x2="44" y2="234" stroke="#047857" stroke-width="1.8" marker-end="url(#s-g)"/><rect x="16" y="236" width="568" height="56" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="264" r="17" fill="#9ca3af"/><text x="44" y="268" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S2</text><text x="72" y="269" font-size="13" fill="#111318" font-weight="700">Supervisor 세션</text><text x="200" y="269" font-size="11.5" fill="#4b5563">Supervisor 세션 · 티켓 · 명부</text><text x="404" y="269" font-size="11.5" fill="#047857">✓ 왕복 1회 · 묵은 요청 0</text><line x1="44" y1="283" x2="44" y2="308" stroke="#047857" stroke-width="1.8" marker-end="url(#s-g)"/><rect x="16" y="310" width="568" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="338" r="17" fill="#2a78d6"/><text x="44" y="342" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S3</text><text x="72" y="343" font-size="13" fill="#111318" font-weight="700">현재 버전 받기</text><text x="200" y="343" font-size="11.5" fill="#4b5563">현재 규칙 정리 문서로 한 번에</text><text x="404" y="343" font-size="11.5" fill="#047857">✓ 인용 버전 = 현재 버전</text><line x1="44" y1="357" x2="44" y2="382" stroke="#047857" stroke-width="1.8" marker-end="url(#s-g)"/><rect x="16" y="384" width="568" height="56" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="412" r="17" fill="#047857"/><text x="44" y="416" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S4</text><text x="72" y="417" font-size="13" fill="#111318" font-weight="700">첫 Subflow</text><text x="200" y="417" font-size="11.5" fill="#4b5563">실제 일 하나 · 규칙마다 자동 검사</text><text x="404" y="417" font-size="11.5" fill="#047857">✓ 계약 표 1행 · 대상 0 = 실패</text><line x1="44" y1="431" x2="44" y2="456" stroke="#047857" stroke-width="1.8" marker-end="url(#s-g)"/><rect x="16" y="458" width="568" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="44" cy="486" r="17" fill="#047857"/><text x="44" y="490" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">S5</text><text x="72" y="491" font-size="13" fill="#111318" font-weight="700">첫 Business Flow</text><text x="200" y="491" font-size="11.5" fill="#4b5563">Subflow 를 묶어 끝까지 · 확인 지점 하나</text><text x="404" y="491" font-size="11.5" fill="#047857">✓ Report · Supervisor 가 닫음 1회</text><text x="16" y="538" font-size="11.5" fill="#4b5563">S0 ~ S2 운영 구성 · S3 공통 규칙 맞추기 · S4 ~ S5 실제 일 — 그 뒤(여러 작업 · 지표)는 필요가 생겼을 때만</text></g>
</svg>