<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="t d">
<title id="t">새 버전 하나가 저장소에 들어가는 여덟 걸음</title><desc id="d">공통 규칙 쪽이 새 버전을 공포하고(0 · 바뀐 행동) 지금 문면과 함정을 한 장으로 묶어(1) 저장소 Supervisor 마다 위임한다(2). 저장소 쪽은 Supervisor 가 세 줄로 수령하고(3) 규칙 개정 작업이 항목마다 있다 · 일부 · 없다로 대조(4)하고 저장소 절차로 개정(5)한다. 공통 규칙 쪽이 심사(6)하면 저장소가 통합 브랜치에 초록으로 머지하고 보고(7)하며, 공통 규칙 쪽이 통합 브랜치에서 다시 잰다(8). 최근 버전 하나는 열네 곳 모두 머지했고 저장소 한 곳과의 왕복은 최소 다섯 번이었다.</desc>
<rect width="600" height="360" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="r-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="r-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">새 버전 하나가 저장소에 들어가는 여덟 걸음</text><text x="16" y="50" font-size="12" fill="#6b7280">위 줄은 공통 규칙 쪽, 아래 줄은 저장소 쪽</text><rect x="16" y="66" width="568" height="104" rx="8" fill="#fff7f1" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="16" y="222" width="568" height="108" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="32" y="96" width="96" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="80" y="116" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">0 공포</text><text x="80" y="133" font-size="10.5" fill="#4b5563" text-anchor="middle">바뀐 행동</text><rect x="142" y="96" width="96" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="190" y="116" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">1 한 장</text><text x="190" y="133" font-size="10.5" fill="#4b5563" text-anchor="middle">문면 · 함정</text><rect x="252" y="96" width="96" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="300" y="116" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">2 위임</text><text x="300" y="133" font-size="10.5" fill="#4b5563" text-anchor="middle">Supervisor 마다</text><rect x="362" y="96" width="96" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="410" y="116" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">6 심사</text><text x="410" y="133" font-size="10.5" fill="#4b5563" text-anchor="middle">적합 · 조건부</text><rect x="472" y="96" width="96" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="520" y="116" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">8 다시 재기</text><text x="520" y="133" font-size="10.5" fill="#4b5563" text-anchor="middle">통합 브랜치</text><rect x="87" y="252" width="100" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="137" y="272" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">3 수령</text><text x="137" y="289" font-size="10.5" fill="#4b5563" text-anchor="middle">세 줄</text><rect x="207" y="252" width="100" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="257" y="272" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">4 대조</text><text x="257" y="289" font-size="10.5" fill="#4b5563" text-anchor="middle">있다 · 일부 · 없다</text><rect x="327" y="252" width="100" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="377" y="272" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">5 개정</text><text x="377" y="289" font-size="10.5" fill="#4b5563" text-anchor="middle">저장소 절차</text><rect x="447" y="252" width="100" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="497" y="272" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">7 머지</text><text x="497" y="289" font-size="10.5" fill="#4b5563" text-anchor="middle">초록 · 보고</text><line x1="128" y1="121" x2="140" y2="121" stroke="#eb6834" stroke-width="1.8" marker-end="url(#r-o)"/><line x1="238" y1="121" x2="250" y2="121" stroke="#eb6834" stroke-width="1.8" marker-end="url(#r-o)"/><path d="M298,148 C298,200 137,200 137,248" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#r-o)"/><line x1="189" y1="277" x2="205" y2="277" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#r-b)"/><line x1="309" y1="277" x2="325" y2="277" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#r-b)"/><path d="M377,250 C377,200 408,200 408,150" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#r-b)"/><path d="M420,150 C460,200 480,210 480,248" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#r-o)"/><path d="M489,250 C500,200 518,200 518,150" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#r-b)"/><text x="32" y="88" font-size="11.5" fill="#eb6834" font-weight="700">공통 규칙 쪽</text><text x="32" y="318" font-size="11.5" fill="#2a78d6" font-weight="700">저장소 쪽 (Supervisor · 규칙 개정 작업)</text><text x="16" y="346" font-size="11.5" fill="#4b5563">최근 버전 하나: 열네 곳 모두 머지 · 저장소 한 곳과 왕복 최소 5번</text></g>
</svg>