<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="t d">
<title id="t">구조 하나, 내용은 저장소마다</title><desc id="d">맨 위 팀 전파용 구조(어떤 항목이 있어야 하나)를 공통 규칙이 구현하고(항목마다 최소 기준), 앱 · 웹 · 서버 · 인프라 저장소의 규칙 문서가 공통 규칙의 인스턴스가 되어 그 저장소의 내용과 문장을 채운다. 공통 규칙에 새 버전이 나오면 공포 → 정리 문서 → 위임 → 수령 → 대조 → 개정 → 심사 → 머지 · 보고 절차로 저장소에 들어간다.</desc>
<rect width="600" height="430" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="t-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="t-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">구조 하나, 내용은 저장소마다</text><text x="16" y="50" font-size="12" fill="#6b7280">위는 «무엇을 갖춰야 하나», 아래로 갈수록 «그 저장소의 내용»</text><rect x="150" y="74" width="300" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="300" y="94" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">팀 전파용 구조</text><text x="300" y="111" font-size="10.5" fill="#4b5563" text-anchor="middle">어떤 항목이 있어야 하나 — 인터페이스</text><line x1="300" y1="128" x2="300" y2="150" stroke="#047857" stroke-width="1.8" marker-end="url(#t-g)"/><rect x="150" y="154" width="300" height="52" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="300" y="174" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">공통 규칙</text><text x="300" y="191" font-size="10.5" fill="#4b5563" text-anchor="middle">항목마다 최소 기준 — 구조의 구현</text><path d="M300,208 C300,240 86,236 86,262" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#t-g)"/><rect x="24" y="266" width="124" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="86" y="286" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">앱 규칙 문서</text><text x="86" y="303" font-size="10.5" fill="#4b5563" text-anchor="middle">저장소의 내용 · 문장</text><path d="M300,208 C300,240 228,236 228,262" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#t-g)"/><rect x="166" y="266" width="124" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="228" y="286" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">웹 규칙 문서</text><text x="228" y="303" font-size="10.5" fill="#4b5563" text-anchor="middle">저장소의 내용 · 문장</text><path d="M300,208 C300,240 370,236 370,262" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#t-g)"/><rect x="308" y="266" width="124" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="286" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">서버 규칙 문서</text><text x="370" y="303" font-size="10.5" fill="#4b5563" text-anchor="middle">저장소의 내용 · 문장</text><path d="M300,208 C300,240 512,236 512,262" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#t-g)"/><rect x="450" y="266" width="124" height="52" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="512" y="286" font-size="12.5" fill="#111318" text-anchor="middle" font-weight="700">인프라 규칙 문서</text><text x="512" y="303" font-size="10.5" fill="#4b5563" text-anchor="middle">저장소의 내용 · 문장</text><text x="300" y="246" font-size="11" fill="#4b5563" text-anchor="middle">인스턴스</text><rect x="24" y="340" width="552" height="72" rx="8" fill="#fff7f1" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/><text x="40" y="362" font-size="13" fill="#111318" font-weight="700">새 버전을 받는 절차 (상시)</text><text x="66" y="394" font-size="11" fill="#4b5563" text-anchor="middle">공포</text><line x1="90" y1="390" x2="102" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="132" y="394" font-size="11" fill="#4b5563" text-anchor="middle">정리 문서</text><line x1="156" y1="390" x2="168" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="198" y="394" font-size="11" fill="#4b5563" text-anchor="middle">위임</text><line x1="222" y1="390" x2="234" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="264" y="394" font-size="11" fill="#4b5563" text-anchor="middle">수령</text><line x1="288" y1="390" x2="300" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="330" y="394" font-size="11" fill="#4b5563" text-anchor="middle">대조</text><line x1="354" y1="390" x2="366" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="396" y="394" font-size="11" fill="#4b5563" text-anchor="middle">개정</text><line x1="420" y1="390" x2="432" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="462" y="394" font-size="11" fill="#4b5563" text-anchor="middle">심사</text><line x1="486" y1="390" x2="498" y2="390" stroke="#eb6834" stroke-width="1.8" marker-end="url(#t-o)"/><text x="528" y="394" font-size="11" fill="#4b5563" text-anchor="middle">머지 · 보고</text></g>
</svg>