<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-labelledby="t d">
<title id="t">verify/screen 이 세는 것</title><desc id="d">예시: 테스트 계획에서 화면 축으로 배정된 화면 10개(N)를 모두 촬영해 기획과 대조하면 일치 8개(M), 불일치 2개(K).</desc>
