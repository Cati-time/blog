dth="44" height="44" rx="6" fill="#e7f6e7" stroke="#0ca30c" stroke-width="2"/><text x="374" y="102" font-size="20" fill="#0a7a0a" text-anchor="middle" font-weight="700">✓</text><text x="374" y="133" font-size="12" fill="#6b7280" text-anchor="middle">7</text><rect x="408" y="72" width="44" height="44" rx="6" fill="#e7f6e7" stroke="#0ca30c" stroke-width="2"/><text x="430" y="102" font-size="20" fill="#0a7a0a" text-anchor="middle" font-weight="700">✓</text><text x="430" y="133" font-size="12" fill="#6b7280" text-anchor="middle">8</text><rect x="464" y="72" width="44" height="44" rx="6" fill="#fbeaea" stroke="#d03b3b" stroke-width="2"/><text x="486" y="102" font-size="20" fill="#d03b3b" text-anchor="middle" font-weight="700">✗</text><text x="486" y="133" font-size="12" fill="#6b7280" text-anchor="middle">9</text><rect x="520" y="72" width="44" height="44" rx="6" fill="#fbeaea" stroke="#d03b3b" stroke-width="2"/><text x="542" y="102" font-size="20" fill="#d03b3b" text-anchor="middle" font-weight="700">✗</text><text x="542" y="133" font-size="12" fill="#6b7280" text-anchor="middle">10</text><path d="M16,144 v8 H452 v-8" fill="none" stroke="#0ca30c" stroke-width="1.5"/><text x="234" y="171" font-size="14" fill="#111318" text-anchor="middle" font-weight="600">✓ 일치 M = 8</text><path d="M464,144 v8 H564 v-8" fill="none" stroke="#d03b3b" stroke-width="1.5"/><text x="514" y="171" font-size="14" fill="#111318" text-anchor="middle" font-weight="600">✗ 불일치 K = 2</text><text x="16" y="222" font-size="12" fill="#4b5563">배정된 화면 N 개를 전부 찍어 기획과 그림으로 대조한다.</text><text x="16" y="240" font-size="12" fill="#4b5563">안 본 화면을 «같다» 로 적지 않는다.</text></g>
