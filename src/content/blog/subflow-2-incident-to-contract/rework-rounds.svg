<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
<title id="t">닫히지 않던 검수</title><desc id="d">왼쪽: 게이트 5회 동안 미충족 항목 수 3, 7, 8, 8, 7. 오른쪽: 4주 뒤 7라운드 동안 새 발견 수 4, 11, 10, 7, 7, 6, 6. 둘 다 0으로 내려가지 않았다.</desc>
