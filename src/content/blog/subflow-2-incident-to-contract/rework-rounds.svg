="middle">4</text><circle cx="272" cy="146.5" r="4.5" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="272" y="136.5" font-size="13" fill="#111318" text-anchor="middle" font-weight="600">7</text><text x="272" y="252" font-size="12" fill="#6b7280" text-anchor="middle">5</text><text x="161" y="272" font-size="12" fill="#6b7280" text-anchor="middle">게이트 회차</text><text x="312" y="28" font-size="15" fill="#111318" font-weight="700">4주 뒤 7라운드 — 새 발견 수</text><text x="312" y="48" font-size="12" fill="#6b7280">«새 발견 0» 이 한 번도 없었다 → 상한 3</text><line x1="338" x2="584" y1="234" y2="234" stroke="#e5e7eb"/><text x="332" y="238" font-size="12" fill="#6b7280" text-anchor="end">0</text><line x1="338" x2="584" y1="184" y2="184" stroke="#e5e7eb"/><text x="332" y="188" font-size="12" fill="#6b7280" text-anchor="end">4</text><line x1="338" x2="584" y1="134" y2="134" stroke="#e5e7eb"/><text x="332" y="138" font-size="12" fill="#6b7280" text-anchor="end">8</text><line x1="338" x2="584" y1="84" y2="84" stroke="#e5e7eb"/><text x="332" y="88" font-size="12" fill="#6b7280" text-anchor="end">12</text><polyline points="350,184 387,96.5 424,109 461,146.5 498,146.5 535,159 572,159" fill="none" stroke="#047857" stroke-width="2" stroke-linejoin="round"/><circle cx="350" cy="184" r="4.5" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="350" y="174" font-size="13" fill="#111318" text-anchor="middle" font-weight="600">4</text><text x="350" y="252" font-size="12" fill="#6b7280" text-anchor="middle">1</text><circle cx="387" cy="96.5" r="4.5" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="387" y="86.5" font-size="13" fill="#111318" text-anchor="middle" font-weight="600">11</text><text x="387" y="252" font-size="12" fill="#6b7280" text-anchor="middle">2</text><circle cx="424" cy="109" r="4.5" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="424" y="99" font-size="13" fill="#111318" text-anchor="middle" font-weight="600">10</text><text x="424" y="252" font-size="12