<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d">
<title id="t">끝났다와 검증됐다는 다르다</title><desc id="d">mock 테스트는 비즈니스 로직, 응답의 형태와 값, 예외 처리, 호출 순서를 본다. JPA 매핑, 트랜잭션 경계, 페이징과 collation, DDL 이 만드는 제약은 실제 DB 에서만 보인다. mock 테스트를 통과하고 확인 SQL 을 사람에게 넘기면 작업은 끝나고, 그 결과가 기록되어야 검증된 것으로 본다.</desc>
<rect width="600" height="290" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">«끝났다» 와 «검증됐다» 는 다르다</text><text x="16" y="50" font-size="12" fill="#6b7280">mock 테스트가 보는 영역과 실제 DB 에서만 드러나는 영역</text><rect x="16" y="70" width="270" height="150" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="32" y="96" font-size="13" fill="#111318" font-weight="700">mock 테스트가 보는 것</text><text x="40" y="124" font-size="12" fill="#111318">✓  비즈니스 로직 · 분기</text><text x="40" y="150" font-size="12" fill="#111318">✓  응답의 형태와 값</text><text x="40" y="176" font-size="12" fill="#111318">✓  예외 처리</text><text x="40" y="202" font-size="12" fill="#111318">✓  호출 순서</text><rect x="314" y="70" width="270" height="150" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="330" y="96" font-size="13" fill="#111318" font-weight="700">실제 DB 에서만 보이는 것</text><text x="338" y="124" font-size="12" fill="#111318">?  JPA 매핑이 실제 컬럼과 맞나</text><text x="338" y="150" font-size="12" fill="#111318">?  트랜잭션 경계</text><text x="338" y="176" font-size="12" fill="#111318">?  페이징 · collation</text><text x="338" y="202" font-size="12" fill="#111318">?  DDL 이 만드는 제약(유니크 · 외래 키)</text><rect x="16" y="240" width="150" height="40" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="91" y="265" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">mock 테스트 통과</text><line x1="168" y1="260" x2="206" y2="260" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#m-gray)"/><rect x="210" y="240" width="170" height="40" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><text x="295" y="265" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">확인 SQL 을 사람에게 넘김</text><text x="295" y="232" font-size="11" fill="#4b5563" text-anchor="middle">여기서 «끝났다»</text><line x1="382" y1="260" x2="420" y2="260" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#m-gray)"/><rect x="424" y="240" width="160" height="40" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.8"/><text x="504" y="265" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">결과 기록 → «검증됐다»</text></g>
</svg>