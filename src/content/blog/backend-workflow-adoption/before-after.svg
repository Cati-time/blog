<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
<title id="t">처음 도입했을 때와 지금</title><desc id="d">규칙 42에서 48, 가드 7에서 9, 결정 기록 3에서 48. 결정 기록이 가장 많이 늘었다.</desc>
<rect width="600" height="300" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">처음 도입했을 때와 지금</text><text x="16" y="50" font-size="12" fill="#6b7280">같은 정의로 센 개수 · 결정 기록이 가장 많이 늘었다</text><rect x="404" y="64" width="12" height="12" rx="2" fill="#9ca3af"/><text x="422" y="74" font-size="12" fill="#4b5563">처음</text><rect x="470" y="64" width="12" height="12" rx="2" fill="#047857"/><text x="488" y="74" font-size="12" fill="#4b5563">지금</text><line x1="40" x2="580" y1="236" y2="236" stroke="#e5e7eb"/><path d="M72,236 V114 Q72,110 76,110 H112 Q116,110 116,114 V236 Z" fill="#9ca3af"/><path d="M124,236 V96 Q124,92 128,92 H164 Q168,92 168,96 V236 Z" fill="#047857"/><text x="94" y="104" font-size="12" fill="#111318" text-anchor="middle">42</text><text x="146" y="86" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">48</text><text x="120" y="258" font-size="13" fill="#111318" text-anchor="middle">규칙</text><path d="M252,236 V219 Q252,215 256,215 H292 Q296,215 296,219 V236 Z" fill="#9ca3af"/><path d="M304,236 V213 Q304,209 308,209 H344 Q348,209 348,213 V236 Z" fill="#047857"/><text x="274" y="209" font-size="12" fill="#111318" text-anchor="middle">7</text><text x="326" y="203" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">9</text><text x="300" y="258" font-size="13" fill="#111318" text-anchor="middle">가드</text><path d="M432,236 V231 Q432,227 436,227 H472 Q476,227 476,231 V236 Z" fill="#9ca3af"/><path d="M484,236 V96 Q484,92 488,92 H524 Q528,92 528,96 V236 Z" fill="#047857"/><text x="454" y="221" font-size="12" fill="#111318" text-anchor="middle">3</text><text x="506" y="86" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">48</text><text x="480" y="258" font-size="13" fill="#111318" text-anchor="middle">결정 기록</text><text x="16" y="286" font-size="12" fill="#4b5563">규칙 = 규칙 문서에 제목으로 선 규칙 · 가드 = 검사 스크립트</text></g>
