<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 476" width="600" height="476" role="img" aria-labelledby="t d">
<title id="t">공유 컴포넌트 10개, 닫힌 형태는 2개</title><desc id="d">표준을 정하기 직전 공유 컴포넌트 10개 중 Render(modifier) 하나만 가진 닫힌 형태는 팝업과 로딩 2개였다. 명령형 메서드는 토스트 · 코치마크 · 블루투스 연결에 모두 12개, 화면 이름별 그리기 함수는 블루투스 연결 · 대화 속도 · 블루투스 상태 · 회원가입에 모두 10개, Render 에 modifier 밖 입력을 받는 것은 토스트 · 코치마크 · 약관 동의 · 기기 활성화 4개였다.</desc>
