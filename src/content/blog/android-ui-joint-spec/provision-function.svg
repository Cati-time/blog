<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
<title id="t">한 번만 제공에서 제공 함수 하나로</title><desc id="d">전: Compose 루트마다 공유 컴포넌트를 따로 제공해서, 한 루트에서 빠뜨려도 NoOp 기본값이 조용히 아무것도 그리지 않았다. 후: 모든 루트가 app 이 가진 제공 함수 하나를 부르고, 그 밖에서 제공하면 규칙 위반이다.</desc>
<rect width="600" height="300" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="p-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/></marker><marker id="p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">«한 번만 제공» → «제공 함수 하나»</text><text x="16" y="50" font-size="12" fill="#6b7280">Compose 루트가 여럿이라 «한 번» 은 지킬 수 없었다 · 루트와 제공 목록은 예시</text><text x="150" y="84" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">전 — 루트마다 따로 제공</text><rect x="30" y="100" width="240" height="44" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="150" y="119" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 A</text><text x="150" y="135" font-size="10.5" fill="#4b5563" text-anchor="middle">A · B · C 제공</text><rect x="30" y="156" width="240" height="44" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="150" y="175" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 B</text><text x="150" y="191" font-size="10.5" fill="#4b5563" text-anchor="middle">A · C 제공</text><rect x="30" y="212" width="240" height="44" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="150" y="231" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 C</text><text x="150" y="247" font-size="10.5" fill="#4b5563" text-anchor="middle">B 제공</text><text x="150" y="282" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">빠뜨려도 NoOp 이 조용히 아무것도 안 그림</text><text x="450" y="84" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">후 — 모든 루트가 한 함수를 부름</text><rect x="320" y="100" width="100" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="124" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 A</text><line x1="422" y1="122" x2="466" y2="178" stroke="#047857" stroke-width="1.8" marker-end="url(#p-g)"/><rect x="320" y="156" width="100" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="180" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 B</text><line x1="422" y1="178" x2="466" y2="178" stroke="#047857" stroke-width="1.8" marker-end="url(#p-g)"/><rect x="320" y="212" width="100" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="236" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">루트 C</text><line x1="422" y1="234" x2="466" y2="178" stroke="#047857" stroke-width="1.8" marker-end="url(#p-g)"/><rect x="470" y="150" width="110" height="56" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="525" y="169" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">제공 함수</text><text x="525" y="185" font-size="10.5" fill="#4b5563" text-anchor="middle">app 이 가짐</text><text x="450" y="282" font-size="11" fill="#4b5563" text-anchor="middle">그 밖에서 제공하면 규칙 위반</text><line x1="300" x2="300" y1="74" y2="290" stroke="#e5e7eb"/></g>
</svg>