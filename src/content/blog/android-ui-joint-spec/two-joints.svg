<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
<title id="t">경계는 두 가지 형태로만</title><desc id="d">삽입형은 다른 feature 의 화면을 화면 A 의 자리(Slot)에 RouteEntry.Render(navigation, modifier) 로 통째로 넣는다. 호출형은 화면 A 의 ViewModel 이 sideEffect 로 시점을 알리면 Route 가 dispatch(Request) 로 feature B 에 요청하고, feature B 는 Render(modifier) 로 그리며 보일지는 module 이 판정한다.</desc>
<rect width="600" height="330" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="j-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="j-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="j-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">경계는 두 가지 형태로만</text><text x="16" y="50" font-size="12" fill="#6b7280">feature 사이의 경계에만 표준을 두고, 안쪽 UI 는 자유</text><text x="150" y="84" font-size="13.5" fill="#111318" text-anchor="middle" font-weight="700">삽입형 — RouteEntry</text><rect x="20" y="98" width="260" height="170" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="34" y="120" font-size="12" fill="#111318" font-weight="700">화면 A</text><rect x="50" y="136" width="200" height="84" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150" y="166" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">feature B 의 화면</text><text x="150" y="186" font-size="11" fill="#4b5563" text-anchor="middle">Render(navigation, modifier)</text><text x="150" y="206" font-size="11" fill="#4b5563" text-anchor="middle">자리(Slot)에 통째로 넣는다</text><text x="150" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">Page · Slot</text><text x="450" y="84" font-size="13.5" fill="#111318" text-anchor="middle" font-weight="700">호출형 — Component + dispatch</text><rect x="320" y="98" width="260" height="170" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="334" y="120" font-size="12" fill="#111318" font-weight="700">화면 A</text><rect x="338" y="140" width="104" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="390" y="159" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">ViewModel</text><text x="390" y="175" font-size="10.5" fill="#4b5563" text-anchor="middle">sideEffect</text><rect x="338" y="208" width="104" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="390" y="227" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">Route</text><text x="390" y="243" font-size="10.5" fill="#4b5563" text-anchor="middle">dispatch(Request)</text><line x1="390" y1="186" x2="390" y2="204" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#j-b)"/><rect x="470" y="140" width="96" height="112" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="518" y="164" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">feature B</text><text x="518" y="190" font-size="10.5" fill="#4b5563" text-anchor="middle">Render(modifier)</text><text x="518" y="206" font-size="10.5" fill="#4b5563" text-anchor="middle">보일지는</text><text x="518" y="220" font-size="10.5" fill="#4b5563" text-anchor="middle">module 이 판정</text><line x1="444" y1="230" x2="466" y2="230" stroke="#047857" stroke-width="1.8" marker-end="url(#j-g)"/><text x="450" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">Overlay — 팝업 · 토스트 · 로딩</text><line x1="300" x2="300" y1="74" y2="300" stroke="#e5e7eb"/></g>
</svg>