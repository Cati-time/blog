<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="t d">
<title id="t">코치마크 — 전과 후</title><desc id="d">전: 쓰는 화면 다섯 곳이 코치마크의 show · dismiss · consume 같은 명령형 메서드를 10곳에서 부르고, 컴포넌트가 노출 판정을 다시 하고, Render(kind) 가 ViewModel 을 쥐고 직접 그렸다. 후: 쓰는 화면은 dispatch(Request) 한 길로 요청만 보내고, 보일지는 module 이 판정하며, 그림은 쓰는 화면 안 앵커 Slot 에서 상태 없는 CoachmarkView 가 그린다. 마이그레이션용 메서드 1개는 홈 화면 조각까지 남는다.</desc>
<rect width="600" height="360" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="c-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/></marker><marker id="c-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="c-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">코치마크 — 전과 후</text><text x="16" y="50" font-size="12" fill="#6b7280">쓰는 화면은 «언제» 만 말하고, 보일지는 module 이 정한다</text><text x="150" y="84" font-size="14" fill="#111318" text-anchor="middle" font-weight="700">전</text><rect x="20" y="100" width="120" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="80" y="119" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">쓰는 화면 ×5</text><text x="80" y="135" font-size="10.5" fill="#4b5563" text-anchor="middle">헤더 · 하트 · 플로팅</text><rect x="170" y="100" width="120" height="64" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="230" y="119" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">코치마크</text><text x="230" y="135" font-size="10.5" fill="#4b5563" text-anchor="middle">show · dismiss ·</text><text x="230" y="152" font-size="10.5" fill="#4b5563" text-anchor="middle">consume · …</text><line x1="142" y1="116" x2="166" y2="116" stroke="#d03b3b" stroke-width="1.8" marker-end="url(#c-r)"/><line x1="142" y1="130" x2="166" y2="130" stroke="#d03b3b" stroke-width="1.8" marker-end="url(#c-r)"/><text x="80" y="168" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">명령형 호출 10곳</text><rect x="170" y="196" width="120" height="44" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="230" y="215" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">노출 판정</text><text x="230" y="231" font-size="10.5" fill="#4b5563" text-anchor="middle">컴포넌트가 다시 함</text><line x1="230" y1="166" x2="230" y2="192" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#c-gray)"/><rect x="170" y="266" width="120" height="44" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="230" y="285" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">Render(kind)</text><text x="230" y="301" font-size="10.5" fill="#4b5563" text-anchor="middle">ViewModel 쥐고 그림</text><line x1="230" y1="242" x2="230" y2="262" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#c-gray)"/><text x="450" y="84" font-size="14" fill="#111318" text-anchor="middle" font-weight="700">후</text><rect x="310" y="100" width="120" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="119" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">쓰는 화면</text><text x="370" y="135" font-size="10.5" fill="#4b5563" text-anchor="middle">요청만 보냄</text><rect x="460" y="100" width="120" height="44" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="520" y="119" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">코치마크</text><text x="520" y="135" font-size="10.5" fill="#4b5563" text-anchor="middle">dispatch 한 길</text><line x1="432" y1="122" x2="456" y2="122" stroke="#047857" stroke-width="1.8" marker-end="url(#c-g)"/><text x="370" y="168" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">dispatch(Request)</text><rect x="460" y="196" width="120" height="44" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="520" y="215" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">module</text><text x="520" y="231" font-size="10.5" fill="#4b5563" text-anchor="middle">보일지 판정</text><line x1="520" y1="146" x2="520" y2="192" stroke="#047857" stroke-width="1.8" marker-end="url(#c-g)"/><rect x="310" y="266" width="120" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="285" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">앵커 Slot</text><text x="370" y="301" font-size="10.5" fill="#4b5563" text-anchor="middle">쓰는 화면 안 자리</text><rect x="460" y="266" width="120" height="44" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="1.5"/><text x="520" y="285" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">CoachmarkView</text><text x="520" y="301" font-size="10.5" fill="#4b5563" text-anchor="middle">상태 없음</text><line x1="432" y1="288" x2="456" y2="288" stroke="#047857" stroke-width="1.8" marker-end="url(#c-g)"/><line x1="300" x2="300" y1="74" y2="320" stroke="#e5e7eb"/><text x="16" y="346" font-size="11.5" fill="#4b5563">마이그레이션용 메서드 1개는 홈 화면 조각까지 남긴다 · 골든마스터 테스트 단언은 그대로</text></g>
</svg>