<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
<title id="t">사본의 세 층과 두 길</title><desc id="d">맨 위 팀용 사본(값을 걸러 내고 뼈대만 남긴 틀), 가운데 원본과 다른 팀의 구현(사본의 항목을 채운 규칙 묶음), 맨 아래 저장소가 채운 값(저장소마다 규칙 문서). 새 버전은 실선으로 아래로 내려가며 한 번 돌았다. 개선은 점선으로 위로 올라가며 아직 0 건이고, 사본을 실제로 받은 다른 팀도 0 곳이다.</desc>
<rect width="600" height="400" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="p-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">사본의 세 층과 두 길</text><text x="16" y="50" font-size="12" fill="#6b7280">위는 «무엇을 갖춰야 하나», 아래로 갈수록 «그 저장소의 값»</text><rect x="150" y="74" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="300" y="96" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">팀용 사본(틀)</text><text x="300" y="114" font-size="11.5" fill="#4b5563" text-anchor="middle">값을 걸러 내고 뼈대만 남김</text><rect x="150" y="176" width="300" height="56" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="300" y="198" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">원본과 다른 팀의 구현</text><text x="300" y="216" font-size="11.5" fill="#4b5563" text-anchor="middle">사본의 항목을 채운 규칙 묶음</text><rect x="150" y="278" width="300" height="56" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="300" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">저장소가 채운 값</text><text x="300" y="318" font-size="11.5" fill="#4b5563" text-anchor="middle">저장소마다 규칙 문서</text><line x1="250" y1="132" x2="250" y2="172" stroke="#047857" stroke-width="2" marker-end="url(#p-g)"/><line x1="250" y1="234" x2="250" y2="274" stroke="#047857" stroke-width="2" marker-end="url(#p-g)"/><text x="240" y="156" font-size="12" fill="#047857" text-anchor="end" font-weight="700">새 버전 받기 · 한 번 돎</text><text x="240" y="258" font-size="12" fill="#047857" text-anchor="end" font-weight="700">대조 후 머지</text><line x1="350" y1="172" x2="350" y2="132" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#p-o)"/><line x1="350" y1="274" x2="350" y2="234" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#p-o)"/><text x="360" y="156" font-size="12" fill="#eb6834" font-weight="700">개선 올리기 · 0 건</text><text x="360" y="258" font-size="12" fill="#eb6834" font-weight="700">받은 다른 팀 · 0 곳</text><text x="16" y="364" font-size="11.5" fill="#4b5563">실선: 실제로 돈 길 / 점선: 길은 설계돼 있지만 아직 돈 적 없음</text><text x="16" y="384" font-size="11.5" fill="#4b5563">받은 팀은 테스트(빈 폴더 설치 · 가상 팀 채택)로만 확인했다</text></g>
</svg>