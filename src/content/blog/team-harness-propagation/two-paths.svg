<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
<title id="t">팀용 템플릿과 두 경로</title><desc id="d">맨 위 팀용 템플릿(우리 팀 고유 내용을 빼고 구조만 남긴 것). 그 아래 왼쪽은 원본(우리 팀이 실제로 쓰는 규칙)이고 오른쪽은 템플릿을 시범으로 받아 써 본 같은 조직의 다른 두 팀(기획 · 디자인)이며, 각각 아래에 저장소가 채운 내용이 있다. 원본에서 템플릿으로 반영하는 경로는 여러 번 돌았고, 두 팀의 시범 피드백도 템플릿에 반영됐다. 지금 두 팀의 저장소는 원본에서 직접 받은 규칙을 쓴다.</desc>
<rect width="600" height="420" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="p-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">팀용 템플릿과 두 경로</text><text x="16" y="50" font-size="12" fill="#6b7280">위는 «무엇을 갖춰야 하나», 아래로 갈수록 «그 저장소의 내용»</text><rect x="150" y="74" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="300" y="96" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">팀용 템플릿(구조)</text><text x="300" y="114" font-size="11.5" fill="#4b5563" text-anchor="middle">고유 내용을 빼고 구조만 남김</text><rect x="24" y="200" width="250" height="56" rx="8" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="149" y="222" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">원본</text><text x="149" y="240" font-size="11.5" fill="#4b5563" text-anchor="middle">우리 팀이 실제로 쓰는 규칙</text><rect x="326" y="200" width="250" height="56" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="2"/><text x="451" y="222" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">다른 팀(기획 · 디자인)</text><text x="451" y="240" font-size="11.5" fill="#4b5563" text-anchor="middle">템플릿을 시범으로 받아 써 봄</text><rect x="24" y="310" width="250" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="149" y="332" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">저장소가 채운 내용</text><text x="149" y="350" font-size="11.5" fill="#4b5563" text-anchor="middle">저장소마다 규칙 문서</text><rect x="326" y="310" width="250" height="50" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5"/><text x="451" y="332" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">저장소가 채운 내용</text><text x="451" y="350" font-size="11.5" fill="#4b5563" text-anchor="middle">지금은 원본에서 직접 받은 규칙</text><line x1="149" y1="258" x2="149" y2="308" stroke="#9ca3af" stroke-width="1.5"/><line x1="451" y1="258" x2="451" y2="308" stroke="#9ca3af" stroke-width="1.5"/><line x1="170" y1="198" x2="170" y2="132" stroke="#047857" stroke-width="2" marker-end="url(#p-g)"/><text x="160" y="170" font-size="12" fill="#047857" text-anchor="end" font-weight="700">반영 · 여러 번 돎</text><line x1="360" y1="198" x2="360" y2="132" stroke="#eb6834" stroke-width="2" marker-end="url(#p-o)"/><text x="352" y="170" font-size="12" fill="#eb6834" text-anchor="end" font-weight="700">피드백 반영</text><line x1="430" y1="132" x2="430" y2="198" stroke="#eb6834" stroke-width="2" marker-end="url(#p-o)"/><text x="440" y="170" font-size="12" fill="#eb6834" font-weight="700">시범으로 받음</text><text x="16" y="384" font-size="11.5" fill="#4b5563">두 팀의 피드백으로 템플릿의 저장소 종류 · 도입 단계를 다시 짰다</text><text x="16" y="404" font-size="11.5" fill="#4b5563">지금 두 팀의 저장소는 원본에서 직접 받은 규칙을 쓴다 — 템플릿의 새 버전으로 운영하는 팀은 아직 없다</text></g>
</svg>