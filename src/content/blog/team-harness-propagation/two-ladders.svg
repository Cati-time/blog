<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-labelledby="t d">
<title id="t">도입 단계와 구축 단계는 맞물려 갑니다</title><desc id="d">저장소의 도입 단계 S0~S1(저장소 파악 · 머지 경로)은 공통 규칙 쪽 구축 단계 H0 점검 · H1 규칙 채택 · H2 개정 번호 발급이, S2(Supervisor 세션)는 H3 요청 수신과 응답 보장이, S3(현재 버전 받기)는 H4 티켓이, S4(규칙과 자동 검사)는 H1(새 가드는 H5)이, S5~S8(Business Flow 완료 ~ Supervisor 운영)은 H6 Supervisor 연결이, S9(운영 지표)는 H9가, 상시 절차(새 버전 받기)는 H8과 H7이 먼저 받쳐 준다. 사람이 한 명뿐인 팀이 S5까지 가는 데 필요한 구축 단계는 H0 H1 H2 H3 H4 H6.</desc>
<rect width="600" height="480" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="l-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">도입 단계와 구축 단계는 맞물려 갑니다</text><text x="16" y="50" font-size="12" fill="#6b7280">저장소가 도입 단계를 하나 올라가려면 오른쪽 구축 단계가 먼저 갖춰져 있어야 한다</text><text x="32" y="82" font-size="12" fill="#2a78d6" font-weight="700">도입 단계(저장소)</text><text x="350" y="82" font-size="12" fill="#047857" font-weight="700">먼저 갖춰야 할 구축 단계(공통 규칙 쪽)</text><rect x="16" y="94" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="120" font-size="12.5" fill="#2a78d6" font-weight="700">S0 ~ S1</text><text x="108" y="120" font-size="12" fill="#111318">저장소 파악 · 머지 경로</text><line x1="318" y1="115" x2="340" y2="115" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="120" font-size="12" fill="#111318">H0 점검 · H1 규칙 채택 · H2 개정 번호 발급</text><rect x="16" y="144" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="170" font-size="12.5" fill="#2a78d6" font-weight="700">S2</text><text x="108" y="170" font-size="12" fill="#111318">Supervisor 세션</text><line x1="318" y1="165" x2="340" y2="165" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="170" font-size="12" fill="#111318">H3 요청 수신 · 응답 보장</text><rect x="16" y="194" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="220" font-size="12.5" fill="#2a78d6" font-weight="700">S3</text><text x="108" y="220" font-size="12" fill="#111318">현재 버전 한 번에 받기</text><line x1="318" y1="215" x2="340" y2="215" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="220" font-size="12" fill="#111318">H4 티켓은 증거로만 닫기</text><rect x="16" y="244" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="270" font-size="12.5" fill="#2a78d6" font-weight="700">S4</text><text x="108" y="270" font-size="12" fill="#111318">규칙과 자동 검사 함께 두기</text><line x1="318" y1="265" x2="340" y2="265" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="270" font-size="12" fill="#111318">H1 (새 가드는 H5 도구 만들기)</text><rect x="16" y="294" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="320" font-size="12.5" fill="#2a78d6" font-weight="700">S5 ~ S8</text><text x="108" y="320" font-size="12" fill="#111318">Business Flow 완료 ~ Supervisor 운영</text><line x1="318" y1="315" x2="340" y2="315" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="320" font-size="12" fill="#111318">H6 Supervisor 연결</text><rect x="16" y="344" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="370" font-size="12.5" fill="#2a78d6" font-weight="700">S9</text><text x="108" y="370" font-size="12" fill="#111318">운영 지표</text><line x1="318" y1="365" x2="340" y2="365" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="370" font-size="12" fill="#111318">H9 Flow 진단 지표</text><rect x="16" y="394" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="420" font-size="12.5" fill="#2a78d6" font-weight="700">상시 절차</text><text x="108" y="420" font-size="12" fill="#111318">새 버전 받기</text><line x1="318" y1="415" x2="340" y2="415" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="420" font-size="12" fill="#111318">H8 새 규칙 배포 경로 (H7 담당 세션)</text><text x="16" y="464" font-size="11.5" fill="#4b5563">사람이 한 명뿐인 팀이 S5 까지 가는 데 필요한 구축 단계: H0 · H1 · H2 · H3 · H4 · H6</text></g>
</svg>