<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-labelledby="t d">
<title id="t">두 사다리는 맞물려 오릅니다</title><desc id="d">저장소 쪽 S0~S1(재기 · 머지되는 길)은 관리 쪽 H0 점검 · H1 규칙 채택 · H2 번호 등록처가, S2(받는 창구)는 H3 수신함과 답장 보장이, S3(지금 버전 받기)는 H4 티켓이, S4(규칙과 집행 수단 쌍)는 H1(새 가드는 H5)이, S5~S8(Business Flow 완주 ~ Supervisor 운영)은 H6 Supervisor 연결이, S9(운영 지표)는 H9가, 상시 고리(새 버전 받기)는 H8과 H7이 먼저 받쳐 준다. 사람이 하나뿐인 팀이 S5까지 가는 데 필요한 관리 쪽 단은 H0 H1 H2 H3 H4 H6.</desc>
<rect width="600" height="480" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="l-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">두 사다리는 맞물려 오릅니다</text><text x="16" y="50" font-size="12" fill="#6b7280">저장소가 한 단 오르려면 오른쪽 관리 쪽 단이 먼저 서 있어야 한다</text><text x="32" y="82" font-size="12" fill="#2a78d6" font-weight="700">레포 사다리</text><text x="350" y="82" font-size="12" fill="#047857" font-weight="700">먼저 서 있어야 할 관리 쪽 사다리</text><rect x="16" y="94" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="120" font-size="12.5" fill="#2a78d6" font-weight="700">S0 ~ S1</text><text x="108" y="120" font-size="12" fill="#111318">저장소 재기 · 머지되는 길</text><line x1="318" y1="115" x2="340" y2="115" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="120" font-size="12" fill="#111318">H0 점검 · H1 규칙 채택 · H2 번호 등록처</text><rect x="16" y="144" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="170" font-size="12.5" fill="#2a78d6" font-weight="700">S2</text><text x="108" y="170" font-size="12" fill="#111318">받는 창구(Supervisor)</text><line x1="318" y1="165" x2="340" y2="165" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="170" font-size="12" fill="#111318">H3 수신함 · 답장 보장</text><rect x="16" y="194" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="220" font-size="12.5" fill="#2a78d6" font-weight="700">S3</text><text x="108" y="220" font-size="12" fill="#111318">지금 버전 한 번에 받기</text><line x1="318" y1="215" x2="340" y2="215" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="220" font-size="12" fill="#111318">H4 티켓은 증거로만 닫기</text><rect x="16" y="244" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="270" font-size="12.5" fill="#2a78d6" font-weight="700">S4</text><text x="108" y="270" font-size="12" fill="#111318">규칙과 집행 수단 쌍</text><line x1="318" y1="265" x2="340" y2="265" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="270" font-size="12" fill="#111318">H1 (새 가드는 H5 도구 만들기)</text><rect x="16" y="294" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="320" font-size="12.5" fill="#2a78d6" font-weight="700">S5 ~ S8</text><text x="108" y="320" font-size="12" fill="#111318">Business Flow 완주 ~ Supervisor 운영</text><line x1="318" y1="315" x2="340" y2="315" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="320" font-size="12" fill="#111318">H6 Supervisor 연결</text><rect x="16" y="344" width="568" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="370" font-size="12.5" fill="#2a78d6" font-weight="700">S9</text><text x="108" y="370" font-size="12" fill="#111318">운영 지표</text><line x1="318" y1="365" x2="340" y2="365" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="370" font-size="12" fill="#111318">H9 Flow 진단 지표</text><rect x="16" y="394" width="568" height="42" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="420" font-size="12.5" fill="#2a78d6" font-weight="700">상시 고리</text><text x="108" y="420" font-size="12" fill="#111318">새 버전 받기</text><line x1="318" y1="415" x2="340" y2="415" stroke="#047857" stroke-width="2" marker-end="url(#l-g)"/><text x="350" y="420" font-size="12" fill="#111318">H8 규칙이 내려가는 길 (H7 담당 세션)</text><text x="16" y="464" font-size="11.5" fill="#4b5563">사람이 하나뿐인 팀이 S5 까지 가는 데 필요한 관리 쪽 단: H0 · H1 · H2 · H3 · H4 · H6</text></g>
</svg>