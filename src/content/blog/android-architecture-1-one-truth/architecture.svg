<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 636" width="600" height="636" role="img" aria-labelledby="t d">
<title id="t">우리 안드로이드 구조</title><desc id="d">app 아래 feature(View·ViewModel), 그 아래 module(정본의 주인 — Action 은 Middleware 를 거쳐 결과 Action 이 되어 Reducer 로 가고 State 가 바뀐다. 일부 module 에는 bridge 신호를 Flow 로 바꿔 Middleware 에 넘기는 Runtime Observer 가 있다), 맨 아래 data(서버·DB)와 bridge(안드로이드 프레임워크). feature 와 module 은 알리기(dispatch), 구독하기(StateReader·Selector), 받기(SideEffectReader) 세 통로로만 대화한다. bridge 의 신호는 Runtime Observer 가 받는다. core(디자인 시스템·로거·유틸)는 층 순서 밖에서 가로지르며 화면이 디자인 시스템을 바로 쓴다. feature 는 data·bridge 를 직접 부르지 않는다.</desc>
<rect width="600" height="636" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">우리 안드로이드 구조</text><text x="16" y="50" font-size="12" fill="#6b7280">의존은 위에서 아래로 한 방향 · 층을 건너뛰지 않는다</text><rect x="16" y="70" width="432" height="46" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="32" y="99" font-size="14" fill="#111318" font-weight="700">app</text><text x="78" y="99" font-size="12" fill="#4b5563">앱 진입 · 조립 · 화면 이동</text><line x1="232" y1="116" x2="232" y2="134" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a-gray)"/><rect x="16" y="136" width="432" height="88" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="32" y="159" font-size="14" fill="#111318" font-weight="700">feature</text><text x="98" y="159" font-size="12" fill="#4b5563">화면</text><rect x="32" y="172" width="150" height="32" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="107" y="193" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">View · 그리기</text><rect x="282" y="172" width="150" height="32" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="357" y="193" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">ViewModel · 화면 상태</text><line x1="184" y1="183" x2="278" y2="183" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#a-blue)"/><line x1="280" y1="197" x2="186" y2="197" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#a-blue)"/><text x="232" y="178" font-size="11" fill="#4b5563" text-anchor="middle">onEvent</text><text x="232" y="214" font-size="11" fill="#4b5563" text-anchor="middle">uiState</text><line x1="40" y1="228" x2="40" y2="300" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#a-blue)"/><text x="50" y="252" font-size="12" fill="#111318" font-weight="700">알리기</text><text x="50" y="268" font-size="11" fill="#4b5563">dispatch(Action)</text><text x="50" y="283" font-size="11" fill="#4b5563">반환값 없음</text><line x1="184" y1="300" x2="184" y2="228" stroke="#047857" stroke-width="1.8" marker-end="url(#a-green)"/><text x="194" y="252" font-size="12" fill="#111318" font-weight="700">구독하기</text><text x="194" y="268" font-size="11" fill="#4b5563">StateReader</text><text x="194" y="283" font-size="11" fill="#4b5563">Selector · 파생된 답</text><line x1="328" y1="300" x2="328" y2="228" stroke="#047857" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-green)"/><text x="338" y="252" font-size="12" fill="#111318" font-weight="700">받기</text><text x="338" y="268" font-size="11" fill="#4b5563">SideEffectReader</text><text x="338" y="283" font-size="11" fill="#4b5563">한 번만 일어나는 사건</text><rect x="16" y="304" width="432" height="184" rx="10" fill="#e8f5ef" stroke="#047857" stroke-width="2"/><text x="32" y="328" font-size="14" fill="#111318" font-weight="700">module</text><text x="96" y="328" font-size="12" fill="#4b5563">도메인 상태의 주인</text><rect x="350" y="313" width="84" height="22" rx="11" fill="#047857" stroke="#047857" stroke-width="1"/><text x="392" y="328" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">정본 (SSOT)</text><rect x="32" y="342" width="100" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="82" y="361" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">Action</text><text x="82" y="377" font-size="11" fill="#4b5563" text-anchor="middle">일어난 일</text><rect x="176" y="342" width="122" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="237" y="361" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">Reducer</text><text x="237" y="377" font-size="11" fill="#4b5563" text-anchor="middle">상태는 여기서만 바뀐다</text><rect x="340" y="342" width="92" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="386" y="361" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">State</text><text x="386" y="377" font-size="11" fill="#4b5563" text-anchor="middle">Store 가 든다</text><line x1="134" y1="364" x2="172" y2="364" stroke="#047857" stroke-width="1.8" marker-end="url(#a-green)"/><line x1="300" y1="364" x2="336" y2="364" stroke="#047857" stroke-width="1.8" marker-end="url(#a-green)"/><rect x="32" y="418" width="118" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="91" y="437" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">Middleware</text><text x="91" y="453" font-size="11" fill="#4b5563" text-anchor="middle">요청 · 변화를 받는다</text><rect x="282" y="418" width="150" height="44" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/><text x="357" y="437" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">Runtime Observer</text><text x="357" y="453" font-size="11" fill="#4b5563" text-anchor="middle">신호를 Flow 로 바꾼다</text><line x1="62" y1="388" x2="62" y2="414" stroke="#047857" stroke-width="1.8" marker-end="url(#a-green)"/><line x1="104" y1="416" x2="104" y2="390" stroke="#047857" stroke-width="1.8" marker-end="url(#a-green)"/><text x="112" y="405" font-size="11" fill="#4b5563">결과는 Action 으로</text><line x1="280" y1="442" x2="154" y2="442" stroke="#047857" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a-green)"/><text x="217" y="435" font-size="11" fill="#4b5563" text-anchor="middle">변화를 넘긴다</text><text x="390" y="480" font-size="11" fill="#4b5563" text-anchor="end">플랫폼 신호를 받는 module 에만</text><line x1="80" y1="464" x2="80" y2="526" stroke="#eb6834" stroke-width="1.8" marker-end="url(#a-orange)"/><text x="88" y="508" font-size="11" fill="#4b5563">부른다</text><line x1="262" y1="490" x2="262" y2="526" stroke="#eb6834" stroke-width="1.8" marker-end="url(#a-orange)"/><text x="270" y="512" font-size="11" fill="#4b5563">부른다</text><line x1="400" y1="526" x2="400" y2="466" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-orange)"/><text x="392" y="512" font-size="11" fill="#4b5563" text-anchor="end">신호</text><rect x="16" y="530" width="208" height="62" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="32" y="554" font-size="14" fill="#111318" font-weight="700">data</text><text x="76" y="554" font-size="12" fill="#4b5563">서버 · DB</text><text x="32" y="575" font-size="11" fill="#4b5563">요청 → 응답, 상태는 없다</text><rect x="240" y="530" width="208" height="62" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/><text x="256" y="554" font-size="14" fill="#111318" font-weight="700">bridge</text><text x="312" y="554" font-size="12" fill="#4b5563">안드로이드 프레임워크</text><text x="256" y="575" font-size="11" fill="#4b5563">오디오 · BT · 생명주기 신호</text><rect x="464" y="136" width="120" height="456" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="478" y="160" font-size="14" fill="#111318" font-weight="700">core</text><text x="478" y="178" font-size="11" fill="#4b5563">층 순서 밖에서</text><text x="478" y="193" font-size="11" fill="#4b5563">가로지른다</text><rect x="474" y="210" width="100" height="32" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="524" y="231" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">디자인 시스템</text><text x="478" y="258" font-size="11" fill="#4b5563">화면이 바로 쓴다</text><rect x="474" y="272" width="100" height="32" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="524" y="293" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">로거</text><rect x="474" y="314" width="100" height="32" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="524" y="335" font-size="12" fill="#111318" text-anchor="middle" font-weight="600">유틸</text><text x="478" y="372" font-size="11" fill="#4b5563">도메인 상태가</text><text x="478" y="387" font-size="11" fill="#4b5563">없는 것만 둔다</text><line x1="474" x2="574" y1="508" y2="508" stroke="#9ca3af" stroke-dasharray="3 3"/><text x="478" y="531" font-size="11" fill="#4b5563">데이터를 다루면</text><text x="478" y="546" font-size="11" fill="#4b5563">core 여도 data 와</text><text x="478" y="561" font-size="11" fill="#4b5563">같다 — 화면은</text><text x="478" y="576" font-size="11" fill="#4b5563">module 을 거친다</text><path d="M448,206 H458 V226 H470" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-gray)"/><circle cx="25" cy="617" r="8" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.5"/><text x="25" y="621" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">✕</text><text x="40" y="621" font-size="12" fill="#111318">feature 는 data · bridge 를 직접 부르지 않는다 — 읽기만 해도 module 을 거친다</text></g>
</svg>