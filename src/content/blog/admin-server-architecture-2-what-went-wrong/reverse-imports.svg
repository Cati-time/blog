<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
<title id="t">거꾸로 가던 의존 19건</title><desc id="d">계층 규칙과 가드를 넣은 날 정리한 거꾸로 가던 의존 19건. domain → service 9건과 domain → client 6건은 domain 패키지에 있던 조율 코드 때문이었고, service → controller 3건은 서비스 DTO 가 controller 요청 클래스를 받아서, client → controller 1건은 바깥 응답이 화면 응답 클래스를 써서 생겼다. 지금 가드 위반은 0이다. 같은 날 controller 가 domain 을 바로 참조하던 49곳도 정리했는데 대부분 오류 코드 enum 과 안 쓰는 import 였다.</desc>
<rect width="600" height="330" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="16" y="30" font-size="18" fill="#111318" font-weight="700">거꾸로 가던 의존 19건 → 0</text><text x="16" y="50" font-size="12" fill="#6b7280">계층 규칙과 가드를 넣은 날 함께 정리 · 지금 가드 위반 0</text><text x="158" y="97" font-size="12.5" fill="#111318" text-anchor="end" font-weight="700">domain → service</text><rect x="168" y="80" width="225" height="24" rx="4" fill="#eb6834"/><text x="401" y="97" font-size="13" fill="#111318" font-weight="700">9건</text><text x="168" y="122" font-size="11.5" fill="#4b5563">조율 코드가 domain 에 있었다</text><text x="158" y="149" font-size="12.5" fill="#111318" text-anchor="end" font-weight="700">domain → client</text><rect x="168" y="132" width="150" height="24" rx="4" fill="#eb6834"/><text x="326" y="149" font-size="13" fill="#111318" font-weight="700">6건</text><text x="168" y="174" font-size="11.5" fill="#4b5563">같은 조율 코드가 바깥도 불렀다</text><text x="158" y="201" font-size="12.5" fill="#111318" text-anchor="end" font-weight="700">service → controller</text><rect x="168" y="184" width="75" height="24" rx="4" fill="#2a78d6"/><text x="251" y="201" font-size="13" fill="#111318" font-weight="700">3건</text><text x="168" y="226" font-size="11.5" fill="#4b5563">서비스 DTO 가 요청 클래스를 받았다</text><text x="158" y="253" font-size="12.5" fill="#111318" text-anchor="end" font-weight="700">client → controller</text><rect x="168" y="236" width="25" height="24" rx="4" fill="#2a78d6"/><text x="201" y="253" font-size="13" fill="#111318" font-weight="700">1건</text><text x="168" y="278" font-size="11.5" fill="#4b5563">바깥 응답이 화면 응답 클래스를 썼다</text><line x1="16" x2="584" y1="292" y2="292" stroke="#e5e7eb"/><text x="16" y="316" font-size="11.5" fill="#4b5563">같은 날 controller → domain 직접 참조 49곳도 정리 — 대부분 오류 코드 enum · 안 쓰는 import</text></g>
</svg>